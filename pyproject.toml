[project]
name = "api-test-cap-prj-v2"
version = "0.1.0"
description = "API automation test for capstone project"
readme = "README.md"
authors = [
    { name = "panpan2001", email = "truonghoc19102001@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.0",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.8.0",
    "python-calamine>=0.8.2",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
]

[project.scripts]
api-test-cap-prj-v2 = "api_test_cap_prj_v2:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pytest-cov",
]

[tool.uv]
package = false
