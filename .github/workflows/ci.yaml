name: CI Pipeline to staging/production environment
on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    env:
      PORT: 5001
      LOG_FOLDER: ./logs
      REPORT_FOLDER: ./reports
      TEST_CASE_FILE_PATH: ./data/test_cases/account_test_cases.xlsx
      BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://datn-be-steel.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # - name: Lint & Format Check (Ruff)
      #   run: |
      #     # Prevent code style errors from merging
      #     uv run ruff check .
      #     uv run ruff format --check .

      - name: Run Pytest with Coverage
        run: |
          uv run pytest --cov=. --cov-report=html:test-reports/coverage.html --junitxml=test-reports/junit.xml

      - name: Run Pytest
        run: uv run pytest

      - name: Upload Test Reports (If Fails or Always)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            test-reports/coverage.html
            test-reports/junit.xml
          retention-days: 3

